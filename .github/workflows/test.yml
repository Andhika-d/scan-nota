name: Tes di emulator
on:
  push:
    branches: [main, v3]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_5
          script: bash .github/tes.sh
      - name: Simpan screenshot ke branch layar
        if: always() && github.ref == 'refs/heads/v3'
        env:
          TOKEN: ${{ github.token }}
        run: |
          ls layar/*.png || exit 0
          cd layar
          git init -q
          git add .
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Screenshot tes"
          git push -qf "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY" HEAD:refs/heads/layar
      - name: Tampilkan penyebab gagal
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("app/build/outputs/androidTest-results/**/*.xml", recursive=True):
              for case in ET.parse(path).iter("testcase"):
                  for failure in case.findall("failure"):
                      text = (failure.text or "")[:1500].replace("%", "%25").replace("\n", "%0A")
                      print(f"::error title={case.get('name')}::{text}")
          PY
